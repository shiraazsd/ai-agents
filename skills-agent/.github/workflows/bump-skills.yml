name: bump-skills
# Opens a PR moving skills.lock to the newest marketplace release; CI on that PR
# runs every eval against this agent before anyone can merge it.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version: { description: "Specific version (default: latest)", required: false }

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml requests
      - id: bump
        env: { GH_TOKEN: "${{ secrets.SKILLS_TOKEN }}" }
        run: |
          python scripts/skills.py bump ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
          echo "version=$(python -c 'import yaml;print(yaml.safe_load(open("skills.lock"))["version"])')" >> "$GITHUB_OUTPUT"
      # A PR opened with the default GITHUB_TOKEN would not trigger CI, so use the bot token.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SKILLS_TOKEN }}
          branch: bump-skills
          title: "Bump skills to ${{ steps.bump.outputs.version }}"
          commit-message: "Bump skills to ${{ steps.bump.outputs.version }}"
          body: "Automated bump of `skills.lock`. Evals run on this PR; merge to deploy."
