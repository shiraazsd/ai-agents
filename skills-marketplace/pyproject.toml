[project]
name = "skillkit"
version = "0.1.0"
description = "Runtime + tooling for the skills marketplace (Claude Code, Copilot, Google ADK)."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2.31", "google-auth>=2.30"]

[project.optional-dependencies]
kerberos = ["requests-gssapi>=1.3"]
adk = ["google-adk>=2.11"]
dev = ["google-adk[eval]>=2.11", "pytest>=8"]

[project.scripts]
mkt = "skillkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
